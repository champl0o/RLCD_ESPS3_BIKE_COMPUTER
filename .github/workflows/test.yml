name: Tests

on:
    push:
        branches: [main]
    pull_request:

jobs:
    native-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Cache PlatformIO
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.platformio
                      ~/.cache/pip
                  key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

            - run: pip install platformio

            - name: Run Unit Tests (native)
              run: pio test -e native

    firmware-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Cache PlatformIO
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.platformio
                  key: pio-esp32-${{ hashFiles('platformio.ini') }}

            - run: pip install platformio

            - name: Build Firmware
              run: pio run -e esp32-s3-devkitc1-n16r8
